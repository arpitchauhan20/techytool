<!DOCTYPE html>
<html lang="en" data-theme="indigo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description"
    content="Techy Tool: Executive task management, Resend automated email delivery, and Google Calendar sync.">
  <title>Techy Tool | Executive Task &amp; Calendar</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="shortcut icon" href="/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <meta name="application-name" content="Techy Tool">
  <meta property="og:site_name" content="Techy Tool">
  <meta property="og:title" content="Techy Tool: Executive Task &amp; Calendar">
  <meta property="og:description" content="Executive task management, Google Calendar synchronization, and automated email reminders.">
  <meta name="google-site-verification" content="8dH5hOafaaGRP7biubnOms_2aKKZb7GJk00LiNtMbTU">

  <!-- Google Identity Services for Direct Google Calendar Sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #080b11;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
      }
      
      /* YouTube / Linear Style Shimmer Skeleton */
      .techy-skeleton-app {
        display: flex;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #080b11;
        overflow: hidden;
        box-sizing: border-box;
      }

      .techy-skeleton-box {
        background: #0f1524;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
      }

      .techy-skeleton-box::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.04) 40%,
          rgba(99, 102, 241, 0.08) 50%,
          rgba(255, 255, 255, 0.04) 60%,
          transparent 100%
        );
        animation: skeletonShimmer 1.6s infinite ease-in-out;
      }

      @keyframes skeletonShimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Sidebar Skeleton (Hidden on Mobile) */
      .skeleton-sidebar {
        width: 270px;
        min-width: 270px;
        height: 100%;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        background: #090d18;
        padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-sizing: border-box;
      }

      .skeleton-brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .skeleton-brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }
      .skeleton-brand-title {
        height: 20px;
        width: 120px;
        border-radius: 6px;
      }

      .skeleton-nav-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .skeleton-nav-item {
        height: 42px;
        width: 100%;
        border-radius: 10px;
      }

      .skeleton-user-card {
        height: 52px;
        width: 100%;
        border-radius: 12px;
      }

      /* Main Stage Skeleton */
      .skeleton-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        min-width: 0;
      }

      .skeleton-topbar {
        height: 64px;
        padding: max(14px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 14px max(24px, env(safe-area-inset-left));
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #080b11;
        box-sizing: border-box;
        gap: 16px;
      }
      .skeleton-title-pill {
        height: 28px;
        width: 160px;
        border-radius: 8px;
      }
      .skeleton-topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .skeleton-date-pill {
        height: 28px;
        width: 110px;
        border-radius: 8px;
      }
      .skeleton-search-bar {
        height: 36px;
        width: 220px;
        border-radius: 10px;
      }

      .skeleton-content-area {
        flex: 1;
        padding: 24px max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
        box-sizing: border-box;
      }

      /* Metric Summary Cards Skeleton */
      .skeleton-stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .skeleton-stat-card {
        height: 90px;
        border-radius: 14px;
      }

      /* Dashboard Dual Panel Skeleton */
      .skeleton-panels-grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 20px;
        flex: 1;
        min-height: 380px;
      }
      .skeleton-panel-card {
        border-radius: 18px;
        height: 100%;
        min-height: 380px;
      }

      @media (max-width: 900px) {
        .skeleton-sidebar {
          display: none;
        }
        .skeleton-stats-row {
          grid-template-columns: repeat(2, 1fr);
        }
        .skeleton-panels-grid {
          grid-template-columns: 1fr;
        }
        .skeleton-search-bar {
          width: 140px;
        }
      }

      @media (max-width: 600px) {
        .skeleton-topbar {
          padding-left: max(16px, env(safe-area-inset-left));
          padding-right: max(16px, env(safe-area-inset-right));
        }
        .skeleton-content-area {
          padding: 16px max(16px, env(safe-area-inset-right)) max(80px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
          gap: 14px;
        }
        .skeleton-stats-row {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .skeleton-date-pill {
          display: none;
        }
      }
    </style>

    <div class="techy-skeleton-app">
      <!-- Sidebar Skeleton -->
      <aside class="skeleton-sidebar">
        <div class="skeleton-brand-row">
          <div class="techy-skeleton-box skeleton-brand-icon"></div>
          <div class="techy-skeleton-box skeleton-brand-title"></div>
        </div>
        <div class="skeleton-nav-list">
          <div class="techy-skeleton-box skeleton-nav-item"></div>
          <div class="techy-skeleton-box skeleton-nav-item"></div>
          <div class="techy-skeleton-box skeleton-nav-item"></div>
          <div class="techy-skeleton-box skeleton-nav-item"></div>
        </div>
        <div class="techy-skeleton-box skeleton-user-card"></div>
      </aside>

      <!-- Main Stage Skeleton -->
      <div class="skeleton-main">
        <header class="skeleton-topbar">
          <div class="techy-skeleton-box skeleton-title-pill"></div>
          <div class="skeleton-topbar-right">
            <div class="techy-skeleton-box skeleton-date-pill"></div>
            <div class="techy-skeleton-box skeleton-search-bar"></div>
          </div>
        </header>

        <main class="skeleton-content-area">
          <div class="skeleton-stats-row">
            <div class="techy-skeleton-box skeleton-stat-card"></div>
            <div class="techy-skeleton-box skeleton-stat-card"></div>
            <div class="techy-skeleton-box skeleton-stat-card"></div>
            <div class="techy-skeleton-box skeleton-stat-card"></div>
          </div>

          <div class="skeleton-panels-grid">
            <div class="techy-skeleton-box skeleton-panel-card"></div>
            <div class="techy-skeleton-box skeleton-panel-card"></div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
